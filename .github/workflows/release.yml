name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write       # firma sigstore de la atestación
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}  # clave sin contraseña (minisign -G -W); vacío = sin firma
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # vacío = release sin firma minisign (update avisa). Variable de repo: clave(s) pública(s), coma-separadas.
          MINISIGN_PUBLIC_KEYS: ${{ vars.MINISIGN_PUBLIC_KEYS }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
      # Firma checksums.txt con minisign solo si el secreto MINISIGN_SECRET_KEY existe.
      - name: Firmar checksums.txt (minisign)
        if: ${{ env.MINISIGN_SECRET_KEY != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/checksums.txt -x dist/checksums.txt.minisig </dev/null
          rm -f "$RUNNER_TEMP/minisign.key"
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.minisig
